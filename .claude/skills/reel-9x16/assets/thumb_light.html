<!doctype html><html><head><meta charset="utf-8">
<!-- 9:16 light (marketing) thumbnail 1080x1920. Edit .tag (optional, account/brand name), .h1 (line 1 black, .mk = orange highlighter line), .cards. -->
<style>
@font-face{font-family:GA1;src:url(fonts/GothicA1-Bold.ttf);font-weight:700}
@font-face{font-family:GA1;src:url(fonts/GothicA1-Black.ttf);font-weight:900}
@font-face{font-family:Emo;src:url(fonts/NotoColorEmoji-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#F4F1EA;font-family:GA1;font-weight:700;color:#151515;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.10) 2px,transparent 2.5px);background-size:44px 44px}
.wrap{position:absolute;left:90px;right:90px;top:400px}
.tag{display:inline-block;font-size:34px;letter-spacing:4px;border:4px solid #151515;border-radius:999px;padding:10px 28px}
.h1{margin-top:50px;font-size:136px;font-weight:900;line-height:1.28;letter-spacing:-6px;white-space:nowrap}
.mk{position:relative;display:inline-block;color:#fff;z-index:0}
.mk:before{content:"";position:absolute;left:-16px;right:-16px;top:-4%;bottom:-6%;background:#FF5A1F;z-index:-1;transform:rotate(-1.5deg);border-radius:10px}
.cards{margin-top:80px;display:flex;gap:28px;align-items:stretch}
.cm{flex:1.35;background:#fff;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.12);padding:30px 32px;display:flex;flex-direction:column;gap:20px}
.cm .r{display:flex;align-items:center;gap:16px;font-size:36px}
.cm .a{width:52px;height:52px;border-radius:50%}
.e{font-family:Emo}
.dm{flex:1;background:#151515;color:#fff;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.dm .s{font-size:36px;color:#bbb}
.dm .z{font-size:120px;font-weight:900;color:#FF5A1F;line-height:1}
</style></head><body><div class="bg"></div>
<div class="wrap">
  <div class="tag">MARKETING</div>
  <div class="h1">다 알려줄수록<br><span class="mk">안 팔립니다</span></div>
  <div class="cards">
    <div class="cm">
      <div class="r"><div class="a" style="background:#FFB4A2"></div>감사합니다 <span class="e">🙏</span></div>
      <div class="r"><div class="a" style="background:#A2D2FF"></div>꿀팁 감사해요!</div>
      <div class="r"><div class="a" style="background:#CDB4DB"></div>저장했어요 <span class="e">❤️</span></div>
    </div>
    <div class="dm"><div class="s">문의</div><div class="z">0</div><div class="s">건</div></div>
  </div>
</div></body></html>
