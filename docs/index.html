<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MODERN RELATION UX — 연애가 반복해서 막히는 이유를 생활환경, 관계패턴, 감정·컨디션까지 함께 분석하는 관계 진단 서비스">
<title>MODERN RELATION UX</title>
<style>
  :root{
    --bg:#faf8f4; --bg-soft:#f2eee6; --surface:#ffffff; --surface-2:#2c2050;
    --text:#1b1826; --text-2:#4a4265; --text-3:#8b81a6; --border:#ece8f3;
    --accent:#4a3980; --accent-strong:#14121c; --accent-contrast:#faf8f4;
    --gold:#a67f34; --gold-soft:#f7eeda;
    --card-shadow: 0 1px 2px rgba(20,18,28,.05), 0 8px 24px -8px rgba(20,18,28,.12);
    --danger-bg:#f8e6e9; --danger-border:rgba(177,73,90,.35); --danger-text:#b1495a;
    --pill-active-bg:#eeeaf7; --pill-active-border:#5b4699;
    --status-low:#6f9c76; --status-watch:#c9a15a; --status-high:#c07a4a; --status-crisis:#b1495a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15121e; --bg-soft:#1c1829; --surface:#221d31; --surface-2:#241c3d;
      --text:#f3f1f8; --text-2:#c8c0dc; --text-3:#8f84ad; --border:#332c4a;
      --accent:#bcb0dd; --accent-strong:#eeeaf7; --accent-contrast:#1b1826;
      --gold:#dbbc80; --gold-soft:#3a3020;
      --card-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.55);
      --danger-bg:#3a1d22; --danger-border:rgba(198,98,114,.5); --danger-text:#e08b98;
      --pill-active-bg:#332a52; --pill-active-border:#9683c9;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15121e; --bg-soft:#1c1829; --surface:#221d31; --surface-2:#241c3d;
    --text:#f3f1f8; --text-2:#c8c0dc; --text-3:#8f84ad; --border:#332c4a;
    --accent:#bcb0dd; --accent-strong:#eeeaf7; --accent-contrast:#1b1826;
    --gold:#dbbc80; --gold-soft:#3a3020;
    --card-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.55);
    --danger-bg:#3a1d22; --danger-border:rgba(198,98,114,.5); --danger-text:#e08b98;
    --pill-active-bg:#332a52; --pill-active-border:#9683c9;
  }
  :root[data-theme="light"]{
    --bg:#faf8f4; --bg-soft:#f2eee6; --surface:#ffffff; --surface-2:#2c2050;
    --text:#1b1826; --text-2:#4a4265; --text-3:#8b81a6; --border:#ece8f3;
    --accent:#4a3980; --accent-strong:#14121c; --accent-contrast:#faf8f4;
    --gold:#a67f34; --gold-soft:#f7eeda;
    --danger-bg:#f8e6e9; --danger-border:rgba(177,73,90,.35); --danger-text:#b1495a;
    --pill-active-bg:#eeeaf7; --pill-active-border:#5b4699;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Pretendard",system-ui,sans-serif;
    word-break:keep-all; overflow-wrap:break-word; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .serif{ font-family:Georgia,"Noto Serif KR","Batang",serif; }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
  .wrap-narrow{max-width:720px;margin:0 auto;padding:0 20px;}
  .wrap-mid{max-width:860px;margin:0 auto;padding:0 20px;}

  header.site{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  header.site .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;max-width:1080px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;min-width:0;flex-shrink:1;}
  .logo .dots{display:flex;align-items:center;flex-shrink:0;}
  .logo .d1{width:22px;height:22px;border-radius:50%;background:var(--surface-2);}
  .logo .d2{width:22px;height:22px;border-radius:50%;background:var(--gold);margin-left:-9px;opacity:.9;}
  .logo .name{font-weight:700;font-size:14.5px;letter-spacing:-0.2px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  nav.links{display:flex;gap:22px;font-size:14px;color:var(--text-2);flex-shrink:0;}
  nav.links button{background:none;border:none;color:inherit;font-size:14px;padding:6px 0;}
  nav.links button:hover{color:var(--text);}
  .header-cta{flex-shrink:0;white-space:nowrap;}
  @media (max-width:640px){
    header.site .bar{padding:12px 14px;}
    nav.links{display:none;}
    .logo .name{font-size:12.5px;max-width:150px;}
    .logo .d1,.logo .d2{width:18px;height:18px;}
  }
  @media (max-width:360px){
    .logo .name{max-width:108px;}
    .header-cta{padding:9px 13px !important;font-size:12.5px !important;}
  }
  .btn{display:inline-block;border-radius:999px;font-weight:600;font-size:14.5px;padding:13px 26px;border:1px solid transparent;transition:all .15s ease;text-align:center;}
  .btn-primary{background:var(--accent-strong);color:var(--accent-contrast);}
  .btn-primary:hover{opacity:.88;}
  .btn-primary:disabled{opacity:.3;cursor:not-allowed;}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--text-2);}
  .btn-outline:hover{border-color:var(--text-3);}
  .btn-sm{padding:8px 16px;font-size:13px;border-radius:999px;background:var(--accent-strong);color:var(--accent-contrast);border:none;}

  main{min-height:60vh;}
  footer.site{border-top:1px solid var(--border);background:var(--bg-soft);}
  footer.site .wrap{padding:36px 20px;font-size:12px;line-height:1.7;color:var(--text-3);}
  footer.site b{color:var(--text-2);font-weight:600;}

  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);text-align:center;}
  h1.hero{font-size:34px;font-weight:700;letter-spacing:-.5px;text-align:center;margin:14px 0 0;color:var(--text);line-height:1.32;}
  p.lede{max-width:560px;margin:18px auto 0;text-align:center;color:var(--text-2);font-size:15.5px;line-height:1.65;}
  .hero-ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
  .hero-ctas .btn{flex:1 1 auto;min-width:150px;}
  .disclaimer{margin-top:20px;text-align:center;font-size:12px;color:var(--text-3);padding:0 10px;}

  section.band{padding:70px 20px;}
  section.band.alt{background:var(--surface);border-top:1px solid var(--border);}
  section.band.dark{background:var(--surface-2);color:#f3f1f8;border-top:1px solid var(--border);}
  @media (max-width:480px){
    section.band{padding:52px 18px;}
    section.band:first-of-type{padding-top:44px;}
    h1.hero{font-size:26px;letter-spacing:-.3px;}
    p.lede{font-size:14.5px;}
    h2.section-title{font-size:20px;}
  }
  h2.section-title{font-size:24px;font-weight:700;text-align:center;color:inherit;}
  .grid2{display:grid;grid-template-columns:1fr;gap:14px;margin-top:36px;}
  @media(min-width:640px){.grid2{grid-template-columns:1fr 1fr;}}
  .grid3{display:grid;grid-template-columns:1fr;gap:14px;margin-top:36px;}
  @media(min-width:640px){.grid3{grid-template-columns:1fr 1fr;}}
  @media(min-width:900px){.grid3{grid-template-columns:1fr 1fr 1fr;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--card-shadow);}
  .reason-card{display:flex;gap:12px;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:18px;}
  .reason-card .n{font-family:Georgia,serif;font-weight:700;font-size:18px;color:var(--gold);}
  .reason-card p{margin:0;font-size:14px;color:var(--text-2);}

  .dim-card h3{margin:0;font-size:16.5px;font-weight:700;}
  .dim-card p{margin:8px 0 0;font-size:13.5px;color:var(--text-3);}
  .step-card{}
  .step-card .num{font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--gold);}
  .step-card h3{margin:8px 0 0;font-size:16px;}
  .step-card p{margin:6px 0 0;font-size:13.5px;color:#cfc6e6;}

  .center{text-align:center;}

  /* Consent */
  .topic-pill{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:center;font-size:12px;color:var(--text-2);}
  .topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  @media(min-width:640px){.topic-grid{grid-template-columns:repeat(4,1fr);}}
  label.check-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;}
  label.check-row:hover{border-color:var(--accent);}
  label.check-row input{margin-top:3px;width:16px;height:16px;flex-shrink:0;}
  label.check-row span{font-size:14px;color:var(--text-2);}

  /* Test flow */
  .test-shell{max-width:560px;margin:0 auto;padding:28px 20px 60px;min-height:100vh;}
  .test-top{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
  .back-btn{background:none;border:none;color:var(--text-3);font-size:18px;}
  .back-btn:disabled{opacity:0;}
  .progress-track{flex:1;height:4px;border-radius:999px;background:var(--border);overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s ease;}

  .section-tag{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  h2.question{font-size:21px;font-weight:700;line-height:1.4;margin:0;color:var(--text);}
  p.help{margin:8px 0 0;font-size:13.5px;color:var(--text-3);}
  .opt-list{display:grid;gap:9px;margin-top:26px;}
  .opt-btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px 18px;text-align:left;font-size:15px;color:var(--text);transition:.12s;}
  .opt-btn:hover{border-color:var(--pill-active-border);background:var(--pill-active-bg);}
  .opt-btn.active{border-color:var(--pill-active-border);background:var(--pill-active-bg);color:var(--accent);}
  .opt-grid{display:grid;gap:9px;margin-top:26px;}
  @media(min-width:520px){.opt-grid.two-col{grid-template-columns:1fr 1fr;}}
  .skip-link{display:block;text-align:center;margin-top:22px;font-size:12px;color:var(--text-3);background:none;border:none;text-decoration:underline;text-underline-offset:3px;width:100%;}
  .skip-link:hover{color:var(--text-2);}

  .scale-item{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px;}
  .scale-item p{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--text-2);}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:9px 14px;font-size:12.5px;color:var(--text-2);min-height:38px;}
  .pill.active{border-color:var(--accent);background:var(--accent);color:var(--accent-contrast);}

  .crisis-opt{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px 18px;text-align:left;font-size:15px;color:var(--text);}
  .crisis-opt:hover{border-color:var(--danger-text);background:var(--danger-bg);}
  .crisis-opt.active{border-color:var(--danger-text);background:var(--danger-bg);}

  /* Result */
  .result-summary{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:var(--card-shadow);}
  .cause-chip{background:var(--bg-soft);border-radius:12px;padding:12px;text-align:center;font-size:13.5px;font-weight:600;color:var(--text-2);}
  .domain-row{margin-bottom:16px;}
  .domain-row:last-child{margin-bottom:0;}
  .domain-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px;}
  .domain-track{height:8px;border-radius:999px;background:var(--border);overflow:hidden;}
  .domain-fill{height:100%;border-radius:999px;}
  .match-list{list-style:none;margin:12px 0 0;padding:0;font-size:14px;color:var(--text-2);}
  .match-list li{display:flex;gap:8px;margin-bottom:8px;}
  .guide-box{background:rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:12px;}
  .guide-box:last-child{margin-bottom:0;}
  .guide-box .label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
  .guide-box p{margin:6px 0 0;font-size:14px;color:#e6e1f2;}
  .crisis-notice{background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:18px;padding:26px;}
  .hotline-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px;}
  @media(min-width:600px){.hotline-grid{grid-template-columns:repeat(3,1fr);}}
  .hotline-card{background:var(--surface);border:1px solid var(--danger-border);border-radius:12px;padding:12px;text-align:center;}
  .hotline-card .l{font-size:11px;color:var(--text-3);}
  .hotline-card .v{font-family:Georgia,serif;font-size:19px;font-weight:700;color:var(--danger-text);margin-top:2px;}
  .mid-banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--text-2);}

  .fade-up{animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .toggle-theme{position:fixed;bottom:18px;right:18px;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:999px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--card-shadow);}
  @media (max-width:480px){
    .toggle-theme{bottom:14px;right:14px;width:42px;height:42px;}
  }

  button, a, input[type="checkbox"]{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  .opt-btn, .crisis-opt, .pill, .btn, .skip-link, label.check-row{ -webkit-tap-highlight-color:transparent; }
</style>
</head>
<body>

<div id="app"></div>
<button class="toggle-theme" id="themeToggle" title="테마 전환">🌓</button>

<script>
(function(){
  "use strict";

  /* ================= DATA ================= */

  var basicInfoSteps = [

  var relationshipStatusStep = { kind:"single", id:"relationshipStatus", section:"연애상태", question:"현재 관계 상태는 어디에 가장 가깝나요?",
    options:[

      {label:"이별 후 회복 중",value:"이별 후 회복 중"},{label:"재회 고민 중",value:"재회 고민 중"},
      {label:"연애 경험 거의 없음",value:"연애 경험 거의 없음",tags:{envRestriction:15}},

  var relationshipFollowUps = {

        {label:"연락",value:"연락"},{label:"표현",value:"표현"},{label:"시간",value:"시간"},
        {label:"이성친구",value:"이성친구",tags:{oppositeFriendConfusion:30}},
        {label:"감정기복",value:"감정기복",tags:{moodSwingRisk:20}},
        {label:"돈",value:"돈"},{label:"미래계획",value:"미래계획"},
        {label:"가족",value:"가족",tags:{familyInfluence:20}},
        {label:"성향 차이",value:"성향 차이"},{label:"성적 친밀감",value:"성적 친밀감"},
        {label:"신뢰 문제",value:"신뢰 문제",tags:{attachmentAnxiety:20}}
      ]},
    "썸": { kind:"single", id:"followUp_썸", section:"연애상태", question:"현재 가장 애매한 지점은 무엇인가요?",
      options:[
        {label:"연락 빈도",value:"연락 빈도",tags:{contactSensitivity:20}},
        {label:"상대의 호감 여부",value:"호감 여부",tags:{attachmentAnxiety:20}},
        {label:"고백 타이밍",value:"고백 타이밍"},{label:"약속 빈도",value:"약속 빈도"},
        {label:"스킨십",value:"스킨십"},{label:"관계 정의",value:"관계 정의"},
        {label:"상대의 이성친구",value:"상대 이성친구",tags:{oppositeFriendConfusion:20}},
        {label:"내 확신 부족",value:"확신 부족",tags:{attachmentAnxiety:15}}
      ]},
    "솔로": { kind:"single", id:"followUp_솔로", section:"연애상태", question:"연애가 잘 시작되지 않는 이유는 무엇에 가깝나요?",
      options:[

  var scoreKeys = ["contactSensitivity","attachmentAnxiety","avoidance","envRestriction","familyInfluence","oppositeFriendConfusion","moodSwingRisk"];

  /* ================= ENGINE ================= */

  function findOption(options, value){
    for (var i=0;i<options.length;i++) if (options[i].value===value) return options[i];
    return undefined;
  }

  function buildSteps(answers){
    var steps = basicInfoSteps.concat([relationshipStatusStep]);
    var relStatus = answers.relationshipStatus;
    if (relStatus && relationshipFollowUps[relStatus]) steps.push(relationshipFollowUps[relStatus]);
    steps = steps.concat(lifestyleSteps, relationshipEnvSteps, contactSteps, conflictSteps, attachmentSteps);
    steps.push({ kind:"info", id:"mentalHealthIntro", section:"감정·컨디션 스크리닝", title:"감정과 컨디션에 대한 질문",
      body:["이제 관계에 영향을 줄 수 있는 감정·컨디션 질문이 나옵니다.",
        "이 질문은 병명을 확정하기 위한 것이 아니라, 연락, 약속, 감정표현, 갈등반응에 영향을 주는 심리적 요인을 확인하기 위한 것입니다.",
        "답변이 불편한 문항은 건너뛸 수 있습니다."], cta:"다음" });
    steps.push(quickScreenStep);
    var primary = answers.quickScreen;
    if (primary && primary!=="none"){
      steps.push(buildScaleStep(primary,false));
      domainOrder.forEach(function(d){ if(d!==primary) steps.push(buildScaleStep(d,true)); });
    } else if (primary==="none"){
      domainOrder.forEach(function(d){ steps.push(buildScaleStep(d,true)); });
    }
    steps.push(bipolarSignalStep);
    steps.push(existingDiagnosisStep);
    var diag = answers.existingDiagnosis;
    if (diag && diag.length>0 && diag.indexOf("없음")===-1 && diag.indexOf("답변하지 않음")===-1) steps.push(diagnosisImpactStep);
    steps.push(medicationStatusStep);
    var medStatus = answers.medicationStatus;
    if (medStatus && medStatus!=="없음" && medStatus!=="비공개") steps.push(medicationImpactStep);
    steps.push(crisisStep);
    return steps;
  }

  function combineProbabilistic(values){
    if (!values.length) return 0;
    var survive = 1;
    values.forEach(function(v){ survive *= 1 - Math.min(Math.max(v,0),100)/100; });
    return Math.round((1-survive)*100);
  }

  function collectSignalScores(answers, allSteps){
    var contributions = {}; scoreKeys.forEach(function(k){contributions[k]=[];});
    allSteps.forEach(function(step){
      if (step.kind!=="single" && step.kind!=="multi") return;
      var answer = answers[step.id];
      if (!answer) return;
      var values = Array.isArray(answer) ? answer : [answer];
      values.forEach(function(val){
        var opt = findOption(step.options, val);
        if (!opt || !opt.tags) return;
        scoreKeys.forEach(function(k){ if(opt.tags[k]) contributions[k].push(opt.tags[k]); });
      });
    });
    var result = {};
    scoreKeys.forEach(function(k){ result[k]=combineProbabilistic(contributions[k]); });
    return result;
  }

  function classifyLevel(score, levels){
    for (var i=0;i<levels.length;i++) if (score<=levels[i].max) return levels[i].label;
    return levels[levels.length-1].label;
  }

  function computeDomainResults(answers){
    var primary = answers.quickScreen;
    var results = [];
    domainOrder.forEach(function(domain){
      var def = domainDefinitions[domain];
      var isLight = !(primary===domain);
      var stepId = "scale_"+domain+"_"+(isLight?"light":"full");
      var raw = answers[stepId];
      var maxItemScore = def.scaleOptions[def.scaleOptions.length-1].score;
      var fullMax = def.items.length*maxItemScore;
      var lightMax = def.lightItemIdx.length*maxItemScore;
      var rawScore = 0;
      if (raw) raw.forEach(function(v){ rawScore += Number(v||0); });
      var estimatedFull = (isLight && lightMax>0) ? Math.round((rawScore/lightMax)*fullMax) : rawScore;
      var normalized = fullMax>0 ? Math.round((estimatedFull/fullMax)*100) : 0;
      var level = classifyLevel(estimatedFull, def.levels);
      results.push({ domain:domain, rawScore:estimatedFull, maxScore:fullMax,
        normalized: Math.min(100,Math.max(0,normalized)), level:level, isLight:isLight });
    });
    return results;
  }

  function computeCrisis(answers){
    var val = answers.crisisCheck;
    var opt = findOption(crisisStep.options, val);
    var risk = opt ? opt.risk : "none";
    return { risk: risk, shouldInterrupt: risk==="high" || risk==="danger" };
  }

  function scoreType(type, signals){
    var total=0, weightSum=0;
    Object.keys(type.weights).forEach(function(key){
      var w = type.weights[key];
      total += (signals[key]||0)*w; weightSum += w;
    });
    return weightSum>0 ? total/weightSum : 0;
  }

  function computeResult(answers){
    var allSteps = buildSteps(answers);
    var scoreSignals = collectSignalScores(answers, allSteps);
    var domainResults = computeDomainResults(answers);
    var crisis = computeCrisis(answers);
    var signals = Object.assign({}, scoreSignals);
    domainResults.forEach(function(d){ signals[d.domain]=d.normalized; });

    var bipolarAns = answers.moodSwingSignal;
    if (bipolarAns && bipolarAns!=="없음") signals.moodSwingRisk = combineProbabilistic([signals.moodSwingRisk,55]);

    var ranked = resultTypes.slice().sort(function(a,b){ return scoreType(b,signals)-scoreType(a,signals); });
    var primaryType = ranked[0], secondaryType = ranked[1];
    var causesSet = []; primaryType.coreCauses.concat(secondaryType.coreCauses).forEach(function(c){ if(causesSet.indexOf(c)===-1) causesSet.push(c); });
    var topCauses = causesSet.slice(0,3);
    var summarySentence = "당신은 현재 "+primaryType.name+" + "+secondaryType.name+"에 가깝습니다.";
    return { signals:signals, domainResults:domainResults, crisis:crisis, primaryType:primaryType, secondaryType:secondaryType, topCauses:topCauses, summarySentence:summarySentence };
  }

  /* ================= STATE ================= */

  var STORAGE_KEY = "mru_html_v1";
  var state = { route:"landing", answers:{}, stepIndex:0, consented:false, showReportAnyway:false };
  try {
    var saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) { var parsed = JSON.parse(saved); state.answers=parsed.answers||{}; state.stepIndex=parsed.stepIndex||0; state.consented=parsed.consented||false; }
  } catch(e){}
  function persist(){ try{ sessionStorage.setItem(STORAGE_KEY, JSON.stringify({answers:state.answers, stepIndex:state.stepIndex, consented:state.consented})); }catch(e){} }

  function navigate(route){ state.route=route; window.scrollTo({top:0,behavior:"auto"}); render(); }
  function resetAll(){ state.answers={}; state.stepIndex=0; state.consented=false; state.showReportAnyway=false; try{sessionStorage.removeItem(STORAGE_KEY);}catch(e){} navigate("landing"); }

  window.__mru = { navigate:navigate, resetAll:resetAll };

        '<nav class="links"><button data-nav="guide">Guide</button><button data-nav="scenario">Scenario</button><button data-nav="expert">Expert</button></nav>'
        + '<button class="btn btn-primary header-cta" style="padding:10px 18px;font-size:13.5px;" data-nav="consent">분석 시작하기</button>')
      + '</div></header>';
  }

      + '<p><b>본 서비스는 의료기관의 진단을 대체하지 않으며, 자기보고 기반의 관계·심리 패턴 분석을 제공합니다.</b></p>'
      + '<p style="margin-top:8px;">위기 상황 시 도움받을 수 있는 곳 — 자살예방상담전화 109 · 정신건강상담전화 1577-0199 · 생명이 위급한 경우 119</p>'
      + '<p style="margin-top:16px;">© '+new Date().getFullYear()+' MODERN RELATION UX</p>'
      + '</div></footer>';

  function optionButtonsHtml(step, selectedValue, kindClass){
    return step.options.map(function(opt){
      var active = selectedValue===opt.value;
      return '<button class="'+kindClass+(active?' active':'')+'" data-act="answerSingle" data-id="'+step.id+'" data-value="'+encodeURIComponent(opt.value)+'">'+opt.label+'</button>';
    }).join('');
  }

  function renderStep(step){
    var current = state.answers[step.id];
    if (step.kind==="single"){
      return '<div class="fade-up"><p class="section-tag">'+step.section+'</p><h2 class="question">'+step.question+'</h2>'
        + (step.help? '<p class="help">'+step.help+'</p>' : '')
        + '<div class="opt-list">' + optionButtonsHtml(step, current, "opt-btn") + '</div>'
        + '<button class="skip-link" data-act="skip">건너뛰기</button></div>';
    }
    if (step.kind==="crisis"){
      return '<div class="fade-up"><p class="section-tag">'+step.section+'</p><h2 class="question">'+step.question+'</h2>'
        + '<p class="help">솔직한 답변이 더 정확한 안내로 이어집니다. 이 질문은 건너뛸 수 없지만, 편한 선택지를 골라주세요.</p>'
        + '<div class="opt-list">' + step.options.map(function(opt){
            var active = current===opt.value;
            return '<button class="crisis-opt'+(active?' active':'')+'" data-act="answerSingle" data-id="'+step.id+'" data-value="'+encodeURIComponent(opt.value)+'">'+opt.label+'</button>';
          }).join('') + '</div></div>';
    }
    if (step.kind==="multi"){
      var sel = Array.isArray(current) ? current : [];
      return '<div class="fade-up"><p class="section-tag">'+step.section+'</p><h2 class="question">'+step.question+'</h2>'
        + (step.help? '<p class="help">'+step.help+'</p>' : '')
        + '<div class="opt-grid two-col">' + step.options.map(function(opt){
            var active = sel.indexOf(opt.value)!==-1;
            return '<button class="opt-btn'+(active?' active':'')+'" style="font-size:14px;" data-act="toggleMulti" data-id="'+step.id+'" data-value="'+encodeURIComponent(opt.value)+'" data-max="'+(step.max||0)+'">'+opt.label+'</button>';
          }).join('') + '</div>'
        + '<button class="btn btn-primary" style="width:100%;margin-top:22px;" '+(sel.length===0?'disabled':'')+' data-act="next">다음</button>'
        + '<button class="skip-link" data-act="skip">건너뛰기</button></div>';
    }
    if (step.kind==="info"){
      return '<div class="fade-up center"><p class="section-tag">'+step.section+'</p><h2 class="question">'+step.title+'</h2>'
        + '<div style="max-width:420px;margin:16px auto 0;color:var(--text-2);font-size:14px;">' + step.body.map(function(b){return '<p style="margin-top:10px;">'+b+'</p>';}).join('') + '</div>'
        + '<button class="btn btn-primary" style="margin-top:26px;" data-act="next">'+step.cta+'</button></div>';
    }
    if (step.kind==="scale"){
      if (state._scaleStepId !== step.id) {
        state._scaleTemp = Array.isArray(current) && current.length===step.items.length ? current.slice() : step.items.map(function(){return "";});
        state._scaleStepId = step.id;
      }
      var vals = state._scaleTemp;
      var itemsHtml = step.items.map(function(item, idx){
        return '<div class="scale-item"><p>'+(idx+1)+'. '+item+'</p><div class="pill-row">'
          + step.scaleOptions.map(function(so){
              var active = vals[idx]===String(so.score);
              return '<button class="pill'+(active?' active':'')+'" data-act="setScale" data-idx="'+idx+'" data-score="'+so.score+'">'+so.label+'</button>';
            }).join('') + '</div></div>';
      }).join('');
      var allAnswered = vals.every(function(v){return v!=="";});
      return '<div class="fade-up"><p class="section-tag">'+step.section+'</p><h2 class="question">'+step.title+'</h2>'
        + '<p class="help">'+step.intro+'</p><p style="font-size:12px;color:var(--text-3);font-weight:600;margin-top:8px;">'+step.timeframe+', 아래 경험이 얼마나 있었나요?</p>'
        + '<div style="margin-top:18px;">'+itemsHtml+'</div>'
        + '<button class="btn btn-primary" style="width:100%;margin-top:18px;" '+(allAnswered?'':'disabled')+' data-act="submitScale">다음</button>'
        + '<button class="skip-link" data-act="skip">건너뛰기</button></div>';
    }
    return '';
  }

  window.__mru.answerSingle = function(id, encodedValue){
    var value = decodeURIComponent(encodedValue);
    state.answers[id]=value; persist(); renderTestBody();
    setTimeout(function(){ window.__mru.nextStep(); }, 220);
  };
  window.__mru.toggleMulti = function(id, encodedValue, max){
    var value = decodeURIComponent(encodedValue);
    var cur = Array.isArray(state.answers[id]) ? state.answers[id].slice() : [];
    var i = cur.indexOf(value);
    if (i!==-1) cur.splice(i,1);
    else { if (max && cur.length>=max) { renderTestBody(); return; } cur.push(value); }
    state.answers[id]=cur; persist(); renderTestBody();
  };
  window.__mru.setScale = function(idx, score){
    state._scaleTemp[idx] = String(score); renderTestBody();
  };
  window.__mru.submitScale = function(){
    var steps = buildSteps(state.answers);
    var step = steps[Math.min(state.stepIndex, steps.length-1)];
    state.answers[step.id] = state._scaleTemp.slice(); persist();
    window.__mru.nextStep();
  };
  window.__mru.skipStep = function(){ window.__mru.nextStep(); };
  window.__mru.nextStep = function(){
    state.stepIndex += 1; persist();
    var steps = buildSteps(state.answers);
    if (state.stepIndex >= steps.length){ navigate("result"); return; }
    render();
  };
  window.__mru.backStep = function(){
    if (state.stepIndex>0){ state.stepIndex -= 1; persist(); render(); }
  };

  function renderTest(){
    var steps = buildSteps(state.answers);
    var idx = Math.min(state.stepIndex, steps.length-1);
    var step = steps[idx];
    var progress = ((idx+1)/(steps.length+1))*100;
    return '<div class="test-shell">'
      + '<div class="test-top"><button class="back-btn" '+(idx===0?'disabled':'')+' data-act="back">←</button>'
      + '<div class="progress-track"><div class="progress-fill" style="width:'+Math.max(2,Math.min(100,progress))+'%;"></div></div></div>'
      + '<div id="testBody">' + renderStep(step) + '</div>'
      + '</div>';
  }
  function renderTestBody(){
    var steps = buildSteps(state.answers);
    var idx = Math.min(state.stepIndex, steps.length-1);
    var step = steps[idx];
    var el = document.getElementById("testBody");
    if (el) el.innerHTML = renderStep(step);
    var bar = document.querySelector(".progress-fill");
    if (bar) bar.style.width = Math.max(2,Math.min(100, ((idx+1)/(steps.length+1))*100))+"%";
    var back = document.querySelector(".back-btn");
    if (back) back.disabled = idx===0;
  }

  function statusColor(n){

    return "var(--status-crisis)";

      ["가족환경과 연애관","가족의 영향이 관계 기대치에 미치는 영향"],["이별 후 회복","미련, 연락 충동, 재회 고민을 다루는 순서"]];

      + '<p class="eyebrow">Guide</p><h1 class="serif section-title" style="margin-top:10px;">짧고 실용적인 관계 가이드</h1>'
      + '<p style="text-align:center;font-size:14px;color:var(--text-3);margin-top:8px;">이런 패턴이 나타납니다 · 오해받는 지점 · 상대에게 설명하는 문장 · 오늘 할 수 있는 행동</p>'
      + '<div class="grid2">' + guides.map(function(g){ return '<div class="card"><h3 class="serif" style="font-size:15.5px;font-weight:700;">'+g[0]+'</h3><p style="margin-top:6px;font-size:13.5px;color:var(--text-3);">'+g[1]+'</p></div>'; }).join('') + '</div>'
      + '</div>';
  }

      ["상대가 인스타는 하면서 답장을 안 할 때","SNS 활동을 캡처해 따지기","인스타 보고 좀 서운했어. 잠깐이라도 답 주면 마음이 놓일 것 같아."],
      ["썸이 애매하게 이어질 때","확신 없이 계속 맞춰주며 기다리기","우리 지금 이 관계를 어떻게 정의하고 있는지 한 번 얘기해보고 싶어."],
      ["연인이 이성친구와 단둘이 만날 때","말없이 참거나 SNS로 몰래 확인하기","그 만남이 나한테는 조금 신경 쓰이는 부분이라, 미리 얘기해주면 좋겠어."],
      ["컨디션이 안 좋아 연락을 못 할 때","설명 없이 잠수타기","내가 컨디션이 안 좋을 때 답장이 느려질 수 있는데, 마음이 식어서 그런 건 아니야."],
      ["약복용 사실을 언제 말할지 고민될 때","관계 초반부터 세세한 진단명까지 전부 설명하기","요즘 컨디션 관리를 위해 약을 먹고 있어. 데이트에 영향이 있으면 미리 말해줄게."],
      ["공황 때문에 데이트 장소가 부담될 때","이유 없이 약속을 취소하기","특정 장소에서 긴장이 심해질 수 있어, 다른 곳으로 정하거나 잠깐 나갔다 올 수 있을까?"],
      ["우울해서 데이트가 힘들 때","아무 말 없이 약속을 미루기","오늘은 에너지가 많이 없어서 짧게 만나거나 다음으로 미뤄도 될까?"],
      ["ADHD 때문에 약속을 까먹었을 때","변명 없이 넘어가거나 자책만 하기","약속을 깜빡했어, 미안해. 앞으로는 알림을 이중으로 맞춰둘게."],
      ["불안해서 확인 연락을 보내고 싶을 때","감정적인 메시지를 바로 보내기","지금 좀 불안한 마음이 들어서 그런데, 편할 때 짧게 답 줄 수 있어?"]
    ];
    return '<div class="wrap-mid fade-up" style="padding:56px 20px;">'
      + '<p class="eyebrow">Scenario</p><h1 class="serif section-title" style="margin-top:10px;">상황별 대응 카드</h1>'
      + '<p style="text-align:center;font-size:14px;color:var(--text-3);margin-top:8px;">연애에서 자주 막히는 순간, 하지 말아야 할 반응과 추천 문장을 확인하세요.</p>'
      + '<div class="grid2">' + scenarios.map(function(s){
          return '<div class="card"><h3 class="serif" style="font-size:15px;font-weight:700;">'+s[0]+'</h3>'
            + '<p style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--danger-text);margin-top:10px;">피해야 할 반응</p><p style="font-size:13.5px;color:var(--text-2);margin-top:4px;">'+s[1]+'</p>'
            + '<p style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:10px;">추천 문장</p><p style="font-size:13.5px;color:var(--text-2);margin-top:4px;font-style:italic;">“'+s[2]+'”</p></div>';
        }).join('') + '</div></div>';
  }

  function renderExpert(){
    var offerings = [["1:1 관계 분석 상담","리포트를 함께 해석하고 구체적인 상황에 맞춰 조언을 받습니다."],
      ["심화 리포트 해석","12개 결과유형, 애착반응, 약복용 영향을 전문가와 함께 확인합니다."],
      ["정신건강 전문가 연결 안내","필요한 경우 정신건강의학과·상담센터 연결을 안내합니다."],
      ["위기 상황 안내","위기 신호가 감지된 경우 즉시 도움받을 수 있는 창구를 안내합니다."]];
    var hotlines = [["생명이 위급하거나 즉각적인 위험이 있는 경우","119"],["자살예방상담전화","109"],["정신건강상담전화","1577-0199"]];
    return '<div class="wrap-narrow fade-up" style="padding:56px 20px;">'
      + '<p class="eyebrow">Expert</p><h1 class="serif section-title" style="margin-top:10px;">전문가와 함께 더 깊이 이해하기</h1>'
      + '<div class="grid2">' + offerings.map(function(o){ return '<div class="card"><h3 style="font-size:15px;font-weight:700;">'+o[0]+'</h3><p style="margin-top:6px;font-size:13.5px;color:var(--text-3);">'+o[1]+'</p></div>'; }).join('') + '</div>'
      + '<div class="card" style="margin-top:24px;background:var(--bg-soft);font-size:14px;color:var(--text-2);line-height:1.7;">MODERN RELATION UX는 심리교육과 관계 코칭을 제공하며, 의학적 진단이나 약물 처방은 정신건강의학과 전문의와 상의해야 합니다.</div>'
      + '<div class="crisis-notice" style="margin-top:16px;"><p style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--danger-text);">위기 지원 안내</p>'
      + '<div class="hotline-grid">' + hotlines.map(function(h){ return '<div class="hotline-card"><div class="l">'+h[0]+'</div><div class="v">'+h[1]+'</div></div>'; }).join('') + '</div></div>'
      + '</div>';
  }

  /* ================= ROOT RENDER ================= */

  function render(){
    var app = document.getElementById("app");
    var body = "";
    var noChrome = state.route==="consent" || state.route==="test";
    body += headerHtml();
    body += '<main>';
    if (state.route==="landing") body += renderLanding();
    else if (state.route==="consent") body += renderConsent();
    else if (state.route==="test") body += renderTest();
    else if (state.route==="result") body += renderResult();
    else if (state.route==="guide") body += renderGuide();
    else if (state.route==="scenario") body += renderScenario();
    else if (state.route==="expert") body += renderExpert();
    body += '</main>';
    if (!noChrome) body += footerHtml();
    app.innerHTML = body;
  }

  /* ================= EVENT DELEGATION =================
     No inline onclick/onchange attributes anywhere — every interactive
     element carries data-nav / data-act (+ data-id/data-value/...) and a
     single delegated listener below dispatches them. This keeps the page
     working under strict script-src CSPs that don't allow inline event
     handler attributes. */
  var appEl = document.getElementById("app");

  appEl.addEventListener("click", function(e){
    var el = e.target.closest("[data-nav],[data-act]");
    if (!el || el.disabled) return;

    if (el.dataset.nav){ navigate(el.dataset.nav); return; }

    switch (el.dataset.act){
      case "scrollHow": {
        var target = document.getElementById("how");
        if (target) target.scrollIntoView({behavior:"smooth"});
        break;
      }
      case "startTest": window.__mru.startTest(); break;
      case "answerSingle": window.__mru.answerSingle(el.dataset.id, el.dataset.value); break;
      case "toggleMulti": window.__mru.toggleMulti(el.dataset.id, el.dataset.value, Number(el.dataset.max||0)); break;
      case "setScale": window.__mru.setScale(Number(el.dataset.idx), Number(el.dataset.score)); break;
      case "submitScale": window.__mru.submitScale(); break;
      case "next": window.__mru.nextStep(); break;
      case "back": window.__mru.backStep(); break;
      case "skip": window.__mru.skipStep(); break;
      case "showReportAnyway": window.__mru.showReportAnyway(); break;
      case "reset": window.__mru.resetAll(); break;
    }
  });

  appEl.addEventListener("change", function(e){
    var el = e.target;
    if (el.dataset && el.dataset.act === "toggleConsent"){
      window.__mru.toggleConsent(Number(el.dataset.idx));
    }
  });

  /* ================= THEME TOGGLE ================= */
  var themeBtn = document.getElementById("themeToggle");
  var current = null;
  themeBtn.addEventListener("click", function(){
    current = current==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", current);
  });

  render();
})();
</script>
