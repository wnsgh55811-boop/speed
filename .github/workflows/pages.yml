# GitHub Pages는 main 브랜치 루트에서 직접 서빙됩니다 (사이트 파일은 main에 배포).
# 이 브랜치에서는 github-pages 환경 보호 규칙 때문에 Actions 배포가 막혀 있어
# 수동 실행 전용으로 남겨둡니다.
name: Deploy static preview to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: imweb-export
      - id: deployment
        uses: actions/deploy-pages@v4
